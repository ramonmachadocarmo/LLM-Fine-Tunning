name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Keep in sync with .python-version / Makefile PY_VER
  PYTHON_VERSION: "3.11.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          # Same lock as local (torch 2.5.1+cu121 wheel). Installs on
          # ubuntu-latest without a GPU; CUDA APIs stay unavailable.
          poetry install --no-root --with dev

      - name: Unit tests
        run: poetry run pytest
