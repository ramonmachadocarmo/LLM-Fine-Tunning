[tool.poetry]
name = "llm-fine-tuning-engine"
version = "0.1.0"
description = "Generic QLoRA/LoRA fine-tuning engine (CLI + web UI)"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
torch = { version = "2.5.1+cu121", source = "pytorch-cu121" }
transformers = "^4.57.0"
datasets = "^4.4.0"
peft = "^0.18.0"
bitsandbytes = "^0.49.0"
trl = "^0.26.0"
accelerate = "^1.12.0"
scipy = "^1.14.0"
pandas = "^2.2.0"
matplotlib = "^3.9.0"
seaborn = "^0.13.0"
tqdm = "^4.66.0"
ollama = "^0.6.0"
requests = "^2.32.0"
pyyaml = "^6.0.0"
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
python-multipart = "^0.0.20"
packaging = ">=23,<26"
gguf = "^0.17.0"

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
